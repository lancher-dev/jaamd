name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # The slug parity test imports a .ts file, which needs Node's native type
      # stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # The client-side id fallback has to agree with the ids Astro emits.
      - run: pnpm test:slug

      # A theme that omits a seed still builds; only this says so.
      - run: pnpm test:themes

      - run: pnpm build

      # `astro build` exits 0 when jaamd skips its plugins (warning only).
      # Asserts on the rendered HTML; catches a renamed markdown processor.
      - name: Assertions on the built site
        run: pnpm smoke

      # Same assertions on the remark plugins.
      - run: pnpm build:unified
      - name: Assertions on the unified build
        run: pnpm smoke

  # `www` pins astro ^7, so the job above never sees a new major. Red here means
  # the next Astro major needs checking, not that main is broken.
  astro-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter www add astro@latest
      - run: pnpm build

      - name: Assertions against the latest Astro
        run: pnpm smoke

      - run: pnpm build:unified
      - name: Assertions against the latest Astro, on unified
        run: pnpm smoke
