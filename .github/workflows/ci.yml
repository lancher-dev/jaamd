name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx tsc --noEmit

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: example/pnpm-lock.yaml
      - working-directory: example
        run: pnpm install
      - working-directory: example
        run: pnpm build

      # `astro build` exits 0 even when jaamd skips its remark plugins (it only
      # logs a warning), so a green build is not evidence that the pipeline ran.
      # This asserts on the rendered HTML, which is what would catch Astro
      # renaming its default markdown processor out from under us.
      - name: Smoke test rendered output
        run: node scripts/smoke-test.mjs
