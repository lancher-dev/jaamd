name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'          # OIDC requires npm >=11.5.1, bundled with Node 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Never publish a version whose markdown pipeline silently stopped
      # working: build the example and assert on the HTML it produces.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build example
        working-directory: example
        run: pnpm install && pnpm build

      - name: Smoke test rendered output
        run: node scripts/smoke-test.mjs

      - name: Publish
        run: npm publish --provenance --access public