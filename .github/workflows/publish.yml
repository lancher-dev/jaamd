name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'          # OIDC requires npm >=11.5.1, bundled with Node 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Never publish a version whose markdown pipeline silently stopped
      # working: build the showcase and assert on the HTML it produces.
      - run: pnpm build
      - run: pnpm smoke

      - name: Publish
        working-directory: packages/jaamd
        run: npm publish --provenance --access public
